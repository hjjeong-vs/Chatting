<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>웹사이트 페이지</title>
  <style>
    /* 채팅 버튼 */
    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      color: white;
      padding: 15px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1001;
    }

    /* 메시지 입력 영역 스타일 */
    #message-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
      align-items: center;
    }

    #message {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    /* 채팅 메시지 표시 영역 */
    #chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

<!-- 메인 콘텐츠 -->

<!-- 채팅봇 버튼 -->
<button id="chat-toggle">💬</button>

<!-- jQuery 라이브러리 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
  let roomId = "f5c6af2e-0ad3-4606-b67a-f45ecca023de";  // 예시 roomId
  let nickname = "익명";  // 기본 닉네임 설정

  // 팝업 창을 통해 채팅 페이지 열기
  document.getElementById("chat-toggle").addEventListener("click", function() {
    // 새 창으로 chat.html 열기
    window.open('http://localhost:8080/chat.html?roomId=' + roomId, '채팅창', 'width=400,height=500');
  });

  // 메시지 전송
  function sendMessage() {
    let message = document.getElementById("message").value;
    if (!message) return;

    // AJAX로 서버에 메시지 보내기
    let currentTime = new Date().toISOString(); // 시간 저장

    let messageData = {
      roomId: roomId,
      sender: nickname,
      message: message,
      time: currentTime
    };

    // 비동기적으로 메시지 전송
    $.ajax({
      url: "http://localhost:8080/chat/messages",  // 서버의 메시지 API 경로
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify(messageData),
      success: function(response) {
        console.log("✅ 메시지 전송 성공:", response);
        displayMessage(messageData.sender, messageData.message, true, formatTime(messageData.time));
      },
      error: function(error) {
        console.error("❌ 메시지 전송 오류:", error);
      }
    });

    document.getElementById("message").value = "";
  }

  // 메시지 표시
  function displayMessage(sender, message, isMine, time) {
    let chatBox = document.getElementById("chat-box");

    if (!chatBox) {
      console.error("❌ chat-box가 존재하지 않습니다.");
      return;
    }

    let containerDiv = document.createElement("div");
    containerDiv.classList.add("message-container", isMine ? "my-container" : "other-container");

    let messageDiv = document.createElement("div");
    messageDiv.classList.add("message", isMine ? "my-message" : "other-message");
    messageDiv.innerHTML = `<strong>${sender}</strong><br>${message}`;

    let timeSpan = document.createElement("span");
    timeSpan.classList.add("timestamp");
    timeSpan.innerText = time;

    if (isMine) {
      containerDiv.appendChild(timeSpan);
      containerDiv.appendChild(messageDiv);
    } else {
      containerDiv.appendChild(messageDiv);
      containerDiv.appendChild(timeSpan);
    }

    chatBox.appendChild(containerDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // 날짜 포맷 함수
  function formatTime(dateTime) {
    let date = new Date(dateTime);
    let hours = date.getHours();
    let minutes = date.getMinutes().toString().padStart(2, '0');
    let period = hours >= 12 ? "오후" : "오전";
    hours = hours % 12 || 12;
    return `${period} ${hours}:${minutes}`;
  }

  // 페이지 로드시 메시지 내역 불러오기 (AJAX)
  function loadChatHistory() {
    $.ajax({
      url: `http://localhost:8080/chat/messages/${roomId}`,  // 서버에서 과거 메시지 가져오기
      method: "GET",
      success: function(response) {
        response.forEach(msg => {
          displayMessage(msg.sender, msg.message, msg.sender === nickname, formatTime(msg.sendTime));
        });
      },
      error: function(error) {
        console.error("❌ 채팅 내역 불러오기 오류:", error);
      }
    });
  }

  // 채팅방에 접속 시 과거 메시지 불러오기
  loadChatHistory();
</script>

</body>
</html>
