<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #87CEFA;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .room-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .room-list li {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            transition: background 0.3s;
        }

        .room-list li a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            display: block;
        }

        .room-list li:hover {
            background: #f0f8ff;
        }

        .create-btn {
            width: 100%;
            padding: 15px;
            background: #87CEFA;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 0 0 15px 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .create-btn:hover {
            background: #4682B4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .modal button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #87CEFA;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .modal button:hover {
            background: #4682B4;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">채팅방 목록</div>
    <ul id="room-list" class="room-list"></ul>
    <button class="create-btn" onclick="showModal()">+ 채팅방 생성</button>
</div>

<div id="roomModal" class="modal">
    <h3>새 채팅방 만들기</h3>
    <input type="text" id="roomName" placeholder="채팅방 이름을 입력하세요"  onkeypress="if(event.keyCode==13) createRoom();"/>
    <button onclick="createRoom()">생성</button>
</div>

<script>
    function loadRooms() {
        fetch('/chat/rooms')
            .then(response => response.json())
            .then(rooms => {
                let roomList = document.getElementById("room-list");
                roomList.innerHTML = "";
                rooms.forEach(room => {
                    let li = document.createElement("li");
                    li.innerHTML = `<a href="chatRoom.html?roomId=${room.id}">${room.name}</a>`;
                    roomList.appendChild(li);
                });
            })
            .catch(error => console.error("채팅방 목록 로드 실패:", error));
    }

    function createRoom() {
        let roomName = document.getElementById("roomName").value.trim();
        if (!roomName) {
            alert("채팅방 이름을 입력하세요.");
            return;
        }

        fetch('/chat/room', {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name: roomName }) // JSON 형식으로 데이터 전송
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("채팅방 생성 실패");
                }
                return response.json(); // JSON 형식으로 응답 받기
            })
            .then(data => {
                console.log("채팅방 생성 성공:", data);
                closeModal();
                loadRooms(); // 채팅방 목록 새로고침
            })
            .catch(error => {
                console.error("채팅방 생성 중 오류 발생:", error);
                alert("채팅방 생성에 실패했습니다.");
            });
    }

    function showModal() {
        document.getElementById('roomModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('roomModal').style.display = 'none';
        document.getElementById("roomName").value = '';
    }

    loadRooms();
</script>

</body>
</html>
